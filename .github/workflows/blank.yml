name: CI - Web Build & Verify

# Kawalan bila workflow ini akan berjalan
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Membolehkan run secara manual dari tab Actions di GitHub
  workflow_dispatch:

jobs:
  build:
    name: Build and Verify Environment
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil kod terkini dari repository
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js (Menggunakan versi 22 LTS untuk kestabilan)
      # Ini akan secara automatik hilangkan amaran 'Node.js 20 deprecated'
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Jika awak guna npm, buka komen di bawah untuk lajukan proses install (caching)
          # cache: 'npm'

      # 3. Semak versi Node.js dan NPM yang sedang berjalan
      - name: 🔍 Verify Environment
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          echo "Sistem sedang berjalan menggunakan Node.js versi terbaru yang stabil."

      # 4. (Optional) Pasang dependencies jika ada file package.json
      # Jika projek awak cuma HTML/JS biasa, bahagian ni takkan buat apa-apa.
      - name: 📦 Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "Tiada package.json dikesan. Melangkau langkah pemasangan (skipping)."
          fi

      # 5. Langkah akhir untuk pengesahan
      - name: ✅ Final Check
        run: |
          echo "Build selesai pada: $(date)"
          echo "Kod anda telah disahkan selamat dan mengikut standard GitHub Actions terbaru."
